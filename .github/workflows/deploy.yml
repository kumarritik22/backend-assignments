name: CD — Test & Deploy

on:
  push:
    branches: [main]    # only runs when code lands on main

jobs:

  # ── Job 1: Run tests ─────────────────────────────
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    defaults:
        run:
            working-directory: ./day-179-cicd-pipeline

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm', cache-dependency-path: day-179-cicd-pipeline/package-lock.json }
      - run: npm ci
      - run: npm run test

  # ── Job 2: Deploy (only if tests passed) ─────────
  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: test              # ← waits for test job to succeed
    if: github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to Render
        run: |
          curl --fail --show-error --silent -X POST "${{ secrets.RENDER_DEPLOY_HOOK }}"